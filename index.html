<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CGL Fundações — Engenharia de fundações desde 1997</title>
  <meta name="description" content="CGL Fundações: estaca hélice contínua monitorada, estaca raiz, estacas secantes, trado mecanizado, estacas cravadas e locação de bombas de concreto. Itabira/MG, desde 1997, obras em todo o Brasil." />
  <link rel="canonical" href="https://cglfundacoes.com.br/" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:site_name" content="CGL Fundações" />
  <meta property="og:title" content="CGL Fundações — Engenharia de fundações desde 1997" />
  <meta property="og:description" content="Estaca hélice contínua, estaca raiz, estacas secantes e fundações especiais em todo o Brasil, com frota própria." />
  <meta property="og:url" content="https://cglfundacoes.com.br/" />
  <meta property="og:image" content="https://cglfundacoes.com.br/imagens/hero.jpg" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "CGL Fundações",
    "description": "Fundações profundas e contenções: hélice contínua, estaca raiz, estacas secantes, trado mecanizado, estacas cravadas e locação de bombas de concreto.",
    "url": "https://cglfundacoes.com.br/",
    "image": "https://cglfundacoes.com.br/imagens/hero.jpg",
    "telephone": "+55-31-3833-4100",
    "email": "orcamento@cglfundacoes.com.br",
    "foundingDate": "1997",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Avenida Hematita, 562 — Distrito Industrial",
      "addressLocality": "Itabira",
      "addressRegion": "MG",
      "postalCode": "35903-051",
      "addressCountry": "BR"
    },
    "openingHoursSpecification": {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
      "opens": "08:00",
      "closes": "18:00"
    },
    "areaServed": "BR"
  }
  </script>
  <meta name="theme-color" content="#14233B" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="imagens/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="imagens/icone-192.png" />
  <link rel="stylesheet" href="css/fontes/fontes.css" />
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>

  <!-- ===== CABEÇALHO ===== -->
  <header class="cabecalho" id="cabecalho">
    <div class="container cabecalho-interno">
      <a href="#inicio" class="logo" id="logo" aria-label="Página inicial CGL Fundações"></a>
      <nav class="nav" id="nav" aria-label="Menu principal">
        <a class="nav-sistema" id="nav-sistema" href="https://app.cglfundacoes.com.br" rel="noopener">Acessar Sistema</a>
      </nav>
      <a href="#orcamento" class="btn btn-accent btn-cabecalho">Solicitar orçamento</a>
      <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <!-- ===== INÍCIO / HERO ===== -->
    <section class="hero" id="inicio">
      <div class="hero-fundo" id="hero-fundo"></div>
      <div class="hero-overlay"></div>
      <div class="container hero-conteudo">
        <p class="hero-tag" id="hero-tag"></p>
        <h1 id="hero-titulo"></h1>
        <p class="hero-sub" id="hero-sub"></p>
        <div class="hero-botoes" id="hero-botoes"></div>
      </div>
    </section>

    <!-- ===== NÚMEROS ===== -->
    <section class="numeros" id="numeros-secao">
      <div class="container numeros-grid" id="numeros-grid"></div>
    </section>

    <!-- ===== A EMPRESA ===== -->
    <section class="secao" id="sobre">
      <div class="container sobre-grid">
        <div class="sobre-imagem" id="sobre-imagem"></div>
        <div class="sobre-texto">
          <p class="secao-tag" id="sobre-tag"></p>
          <h2 id="sobre-titulo"></h2>
          <div id="sobre-paragrafos"></div>
          <div class="valores" id="sobre-valores"></div>
        </div>
      </div>
    </section>

    <!-- ===== SERVIÇOS ===== -->
    <section class="secao secao-clara" id="servicos">
      <div class="container">
        <div class="secao-cabecalho">
          <p class="secao-tag" id="servicos-tag"></p>
          <h2 id="servicos-titulo"></h2>
        </div>
        <div class="servicos-grid" id="servicos-grid"></div>
      </div>
    </section>

    <!-- ===== EQUIPAMENTOS ===== -->
    <section class="secao secao-escura" id="equipamentos">
      <div class="container equip-grid">
        <div class="equip-texto">
          <p class="secao-tag" id="equip-tag"></p>
          <h2 id="equip-titulo"></h2>
          <p class="equip-descricao" id="equip-descricao"></p>
        </div>
        <div class="equip-destaques" id="equip-destaques"></div>
      </div>
    </section>

    <!-- ===== OBRAS ===== -->
    <section class="secao secao-clara" id="obras">
      <div class="container">
        <div class="secao-cabecalho">
          <p class="secao-tag" id="obras-tag"></p>
          <h2 id="obras-titulo"></h2>
        </div>
        <div class="obras-grid" id="obras-grid"></div>
      </div>
    </section>

    <!-- ===== ORÇAMENTO ===== -->
    <section class="secao secao-orcamento" id="orcamento">
      <div class="container orcamento-grid">
        <div class="orcamento-intro">
          <p class="secao-tag" id="orc-tag"></p>
          <h2 id="orc-titulo"></h2>
          <p id="orc-texto"></p>
          <a class="whatsapp-link" id="orc-whatsapp" target="_blank" rel="noopener">
            Prefere falar agora? Chamar no WhatsApp
          </a>
        </div>
        <form class="orcamento-form" id="orcamento-form" novalidate>
          <div class="campo">
            <label for="f-nome">Nome *</label>
            <input type="text" id="f-nome" name="nome" required />
          </div>
          <div class="campo">
            <label for="f-empresa">Empresa</label>
            <input type="text" id="f-empresa" name="empresa" />
          </div>
          <div class="campo-linha">
            <div class="campo">
              <label for="f-email">E-mail *</label>
              <input type="email" id="f-email" name="email" required />
            </div>
            <div class="campo">
              <label for="f-telefone">Telefone *</label>
              <input type="tel" id="f-telefone" name="telefone" required />
            </div>
          </div>
          <div class="campo-linha">
            <div class="campo">
              <label for="f-cidade">Cidade / UF</label>
              <input type="text" id="f-cidade" name="cidade" />
            </div>
            <div class="campo">
              <label for="f-servico">Serviço de interesse</label>
              <select id="f-servico" name="servico"></select>
            </div>
          </div>
          <div class="campo">
            <label for="f-mensagem">Descreva sua obra</label>
            <textarea id="f-mensagem" name="mensagem" rows="4"></textarea>
          </div>
          <button type="submit" class="btn btn-accent btn-bloco">Enviar solicitação</button>
          <p class="form-aviso" id="form-aviso" role="status"></p>
        </form>
      </div>
    </section>

    <!-- ===== CONTATO ===== -->
    <section class="secao" id="contato">
      <div class="container">
        <div class="secao-cabecalho">
          <p class="secao-tag" id="contato-tag"></p>
          <h2 id="contato-titulo"></h2>
        </div>
        <div class="contato-grid">
          <div class="contato-info" id="contato-info"></div>
          <div class="contato-mapa" id="contato-mapa"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== RODAPÉ ===== -->
  <footer class="rodape">
    <div class="container rodape-interno" id="rodape-interno"></div>
  </footer>

  <a class="whatsapp-flutuante" id="whatsapp-flutuante" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
    <svg viewBox="0 0 32 32" width="28" height="28" fill="currentColor" aria-hidden="true">
      <path d="M16 3C9 3 3.5 8.5 3.5 15.5c0 2.4.7 4.6 1.8 6.5L3 29l7.2-2.3c1.8 1 3.9 1.6 6 1.6 7 0 12.5-5.5 12.5-12.5S23 3 16 3zm0 22.7c-1.9 0-3.7-.5-5.3-1.5l-.4-.2-4.3 1.4 1.4-4.2-.3-.4c-1-1.7-1.6-3.6-1.6-5.6 0-5.8 4.7-10.5 10.5-10.5S26.5 9.7 26.5 15.5 21.8 25.7 16 25.7zm5.8-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-2-1.8-2.3-.2-.3 0-.5.1-.7.1-.1.3-.4.5-.6.2-.2.2-.3.3-.6.1-.2 0-.4 0-.6 0-.2-.7-1.8-1-2.4-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.3 5.1 4.6.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.9-.8 2.1-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.2-.6-.4z"/>
    </svg>
  </a>

  <script src="conteudo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
